<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books Catalog</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
    h1 { color: #2c3e50; text-align: center; }
    .book-list { max-width: 800px; margin: 0 auto; }
    .book { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .book h3 { margin: 0 0 5px 0; color: #2980b9; }
    .book p { margin: 5px 0; color: #555; }
  </style>
</head>
<body>
  <h1>📚 Books Catalog</h1>
  <div class="book-list" id="books-list"></div>

  <script>
    window.onload = () => {
      fetch('/api/books')
        .then(res => res.json())
        .then(books => {
          const container = document.getElementById('books-list');
          container.innerHTML = books.map(book => `
            <div class="book">
              <h3>${book.title}</h3>
              <p><strong>by ${book.author}</strong></p>
            </div>
          `).join('');
        })
        .catch(err => console.error('Error fetching books:', err));
    };
  </script>
</body>
</html>
